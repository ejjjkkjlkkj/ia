name: No-key hourly repository audit

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-key-hourly-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic audit and available tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p audit-report
          {
            echo "# Hourly repository audit"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- UTC time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Repository inventory"
            find . -maxdepth 4 -type f \( -name 'pyproject.toml' -o -name 'pytest.ini' -o -name 'tox.ini' -o -name 'setup.cfg' -o -name 'Cargo.toml' -o -name 'package.json' -o -name 'go.mod' -o -name 'CMakeLists.txt' \) -not -path './.git/*' | sort
            echo
            echo "## Python syntax check"
          } | tee audit-report/report.md

          python -m compileall -q . >>audit-report/report.md 2>&1
          py_rc=$?
          echo "- Python compileall exit code: ${py_rc}" | tee -a audit-report/report.md

          echo >> audit-report/report.md
          echo "## Whitespace / conflict-marker check" | tee -a audit-report/report.md
          git diff --check >>audit-report/report.md 2>&1
          diff_rc=$?
          echo "- git diff --check exit code: ${diff_rc}" | tee -a audit-report/report.md

          echo >> audit-report/report.md
          echo "## Available test runners" | tee -a audit-report/report.md
          if find . -maxdepth 4 -type f -name 'Cargo.toml' -not -path './.git/*' -print -quit | grep -q .; then
            if ! command -v cargo >/dev/null 2>&1; then
              echo "- Rust manifests found but cargo unavailable: BLOCKED" | tee -a audit-report/report.md
            else
              while IFS= read -r manifest; do
                echo "- Running cargo test --manifest-path ${manifest}" | tee -a audit-report/report.md
                cargo test --manifest-path "${manifest}" >>audit-report/report.md 2>&1 || echo "- FAIL: ${manifest}" | tee -a audit-report/report.md
              done < <(find . -maxdepth 4 -type f -name 'Cargo.toml' -not -path './.git/*' | sort)
            fi
          else
            echo "- No Cargo.toml found within depth 4: NOT APPLICABLE" | tee -a audit-report/report.md
          fi

          if [ -d tests ] || find . -maxdepth 3 -type f -name 'test_*.py' -not -path './.git/*' -print -quit | grep -q .; then
            echo "- Running unittest discovery" | tee -a audit-report/report.md
            python -m unittest discover -v >>audit-report/report.md 2>&1 || echo "- unittest discovery: FAIL (see log)" | tee -a audit-report/report.md
          else
            echo "- No obvious Python tests found: NOT APPLICABLE" | tee -a audit-report/report.md
          fi

          echo >> audit-report/report.md
          echo "## Scope limitation" | tee -a audit-report/report.md
          echo "This workflow does not call an LLM, modify source files, open PRs, or prove runtime/physical-device behavior. It is a scheduled deterministic audit, not an autonomous coding agent." | tee -a audit-report/report.md

          if [ "${py_rc}" -ne 0 ] || [ "${diff_rc}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-audit-report
          path: audit-report/report.md
          if-no-files-found: warn
          retention-days: 14
