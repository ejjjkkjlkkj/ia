name: Continuous repository maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: continuous-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository hygiene and manifest validation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .maintenance-report
          report=.maintenance-report/report.txt
          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "UTC: $(date -u +%FT%TZ)"
            echo
          } > "$report"
          failed=0
          if [ -f pyproject.toml ] || find . -maxdepth 3 -name '*.py' -print -quit | grep -q .; then
            echo "Python syntax check" | tee -a "$report"
            while IFS= read -r -d '' file; do
              if ! python -m py_compile "$file" >>"$report" 2>&1; then failed=1; fi
            done < <(find . -path './.git' -prune -o -path './.venv' -prune -o -name '*.py' -print0)
          fi
          if [ -d tests ]; then
            echo "Python regression tests" | tee -a "$report"
            if python -m pip install --disable-pip-version-check pytest >>"$report" 2>&1; then
              if ! PYTHONPATH=src python -m pytest -q tests >>"$report" 2>&1; then failed=1; fi
            else
              echo "pytest install unavailable; falling back to unittest discovery" | tee -a "$report"
              if ! PYTHONPATH=src python -m unittest discover -s tests -v >>"$report" 2>&1; then failed=1; fi
            fi
          else
            echo "PARTIAL: no tests/ directory; Python regression suite not discovered" | tee -a "$report"
          fi
          while IFS= read -r -d '' file; do
            echo "JSON: $file" | tee -a "$report"
            if ! python -m json.tool "$file" >/dev/null 2>>"$report"; then failed=1; fi
          done < <(find . -path './.git' -prune -o -path './.venv' -prune -o -name '*.json' -print0)
          if [ -f tools/validate_benchmark_truth.py ] && [ -f benchmarks/complex_tasks.json ]; then
            echo "Independent complex benchmark oracle" | tee -a "$report"
            if ! python tools/validate_benchmark_truth.py >>"$report" 2>&1; then failed=1; fi
          else
            echo "PARTIAL: benchmark oracle or suite missing" | tee -a "$report"
          fi
          if [ -f Cargo.toml ]; then
            echo "Rust tests" | tee -a "$report"
            if ! cargo test --workspace --all-targets >>"$report" 2>&1; then
              echo "Workspace test failed or workspace layout is unsupported; inspect log." >>"$report"
              failed=1
            fi
          fi
          if [ -f go.mod ]; then
            echo "Go tests" | tee -a "$report"
            if ! go test ./... >>"$report" 2>&1; then failed=1; fi
          fi
          if [ -f package.json ]; then
            echo "Node project detected; package scripts are not run automatically without a lockfile." | tee -a "$report"
          fi
          echo "RESULT=$([ "$failed" -eq 0 ] && echo PASS || echo FAIL)" | tee -a "$report"
          exit "$failed"

      - name: Run bounded offline autonomous maintenance audit
        if: always()
        shell: bash
        run: |
          set +e
          if [ ! -f tools/autonomous_agent.py ]; then
            echo "PARTIAL: offline maintenance agent is missing"
            exit 0
          fi
          PYTHONPATH=src python tools/autonomous_agent.py --cycles 1 --report .maintenance-report/autonomous-agent.json
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "PARTIAL: deterministic checks completed, but project-owned generative coding remains blocked"
            exit 0
          fi
          exit "$status"

      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-maintenance-${{ github.run_id }}
          path: .maintenance-report/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
