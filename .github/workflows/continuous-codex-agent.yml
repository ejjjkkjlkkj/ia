name: Continuous repository validation and agent readiness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: continuous-agent-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate repository and report coding-agent readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository rules are present
        run: |
          python - <<'PY'
          from pathlib import Path
          required = ["AGENTS.md", ".github/agent-task.md", "README.md"]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit("FAIL: missing agent policy files: " + ", ".join(missing))
          print("PASS: repository agent policy files exist")
          PY

      - name: Validate Python syntax and JSON manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          excluded = {".git", ".venv", "venv", "node_modules", "__pycache__", "build", "dist"}
          files = [p for p in Path(".").rglob("*") if p.is_file() and not any(part in excluded for part in p.parts)]
          py_files = [p for p in files if p.suffix == ".py"]
          json_files = [p for p in files if p.suffix == ".json"]
          errors = []
          for path in py_files:
              try:
                  compile(path.read_bytes(), str(path), "exec")
              except (OSError, SyntaxError, UnicodeError) as exc:
                  errors.append(f"{path}: {type(exc).__name__}: {exc}")
          for path in json_files:
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  errors.append(f"{path}: {type(exc).__name__}: {exc}")
          print(f"Checked Python={len(py_files)} JSON={len(json_files)}")
          if errors:
              raise SystemExit("\n".join(errors))
          PY

      - name: Validate independent benchmark oracle
        run: python tools/validate_benchmark_truth.py

      - name: Run regression suite
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests

      - name: Report coding-agent readiness without cloud fallback
        if: always()
        shell: bash
        env:
          VALIDATION_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p agent-evidence
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          job_status = os.environ.get("VALIDATION_JOB_STATUS", "unknown")
          validation_status = "PASS" if job_status == "success" else ("FAIL" if job_status == "failure" else "PARTIAL")
          report = {
              "schema_version": 1,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "workflow_job_status": job_status,
              "repository_validation": validation_status,
              "generative_coding_status": "BLOCKED",
              "reason": "A repository-owned coding model and validated checkpoint/patch contract are not yet available to this hosted runner.",
              "cloud_model_used": False,
              "api_key_required": False,
              "local_ollama_reachable_from_runner": False,
              "source_mutation": False,
              "pull_request_or_merge_created": False,
              "next_step": "Validate the repository-owned model and bounded patch/apply/review loop locally; do not claim autonomous code generation until its tests pass.",
          }
          Path("agent-evidence/agent-readiness.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("agent-report.md").write_text(
              "# Continuous agent readiness report\n\n"
              "- Repository validation: see the preceding workflow steps.\n"
              "- Generative coding: **BLOCKED**.\n"
              "- Hosted/cloud model: not invoked. No API key is required.\n"
              "- Reason: the repository-owned coding model, validated checkpoint, and bounded patch contract are not yet available to this runner.\n"
              "- No source changes, commits, pull requests, or merges are created by this workflow.\n"
              "- Next: validate the repository-owned model and bounded local patch/apply/review loop.\n",
              encoding="utf-8",
          )
          print("PARTIAL: deterministic checks only; generative coding remains BLOCKED.")
          PY

      - name: Upload agent readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-readiness-${{ github.run_id }}
          path: |
            agent-report.md
            agent-evidence/agent-readiness.json
          if-no-files-found: error
          retention-days: 14
