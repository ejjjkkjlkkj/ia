name: IA baseline model functional tests

on:
  push:
    branches: [main, master]
    paths:
      - "src/ia_reference/**"
      - "tests/**"
      - ".github/workflows/model-baseline.yml"
  pull_request:
    paths:
      - "src/ia_reference/**"
      - "tests/**"
      - ".github/workflows/model-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ia-model-baseline-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Baseline / \${{ matrix.os }} / Python \${{ matrix.python }}
    runs-on: \${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: \${{ matrix.python }}
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: CLI train / checkpoint / inference smoke test
        shell: python {0}
        run: |
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          env = os.environ.copy()
          env["PYTHONPATH"] = str(Path("src").resolve())
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              train = root / "train.txt"
              heldout = root / "heldout.txt"
              checkpoint = root / "model.json"
              train.write_text("the screen reader reads text the screen reader speaks text\n", encoding="utf-8")
              heldout.write_text("the screen reader reads text\n", encoding="utf-8")
              subprocess.run([sys.executable, "-m", "ia_reference.ngram", "train", str(train), str(checkpoint)], env=env, check=True)
              subprocess.run([sys.executable, "-m", "ia_reference.ngram", "evaluate", str(checkpoint), str(heldout)], env=env, check=True)
              subprocess.run([sys.executable, "-m", "ia_reference.ngram", "generate", str(checkpoint), "--prompt", "the screen reader", "--max-tokens", "5"], env=env, check=True)
