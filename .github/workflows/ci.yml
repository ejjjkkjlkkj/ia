name: IA Models and Language Catalogue CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue-and-docs:
    name: Validate catalogue and model-track scaffolding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify required project and agent-contract documents
        shell: bash
        run: |
          set -euo pipefail
          for f in AGENTS.md README.md LANGUAGE-CATALOG.md MODEL-SPEC.md TRAINING-ROADMAP.md MODELS-INDEX.md; do
            test -s "$f" || { echo "FAIL: missing or empty $f"; exit 1; }
            echo "PASS: $f"
          done

      - name: Validate model-track READMEs
        shell: python {0}
        run: |
          import pathlib, sys
          root = pathlib.Path("models")
          if not root.is_dir():
              print("FAIL: models/ directory missing")
              sys.exit(1)
          tracks = sorted(p for p in root.iterdir() if p.is_dir())
          missing = [str(p / "README.md") for p in tracks if not (p / "README.md").is_file() or not (p / "README.md").stat().st_size]
          print(f"Discovered model tracks: {len(tracks)}")
          for track in tracks:
              print(("FAIL: " if track / "README.md" in missing else "PASS: ") + str(track))
          if missing:
              print("Missing track README files:", *missing, sep="\n")
              sys.exit(1)
          if not tracks:
              print("FAIL: no model tracks found")
              sys.exit(1)
          print("PASS: every discovered track has a non-empty README")

      - name: Check Markdown relative links
        shell: python {0}
        run: |
          import pathlib, re, sys
          root = pathlib.Path(".")
          failures = []
          for path in root.rglob("*.md"):
              if ".git" in path.parts or ".github" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for target in re.findall(r"!?(?:\[[^\]]*\])\(([^)]+)\)", text):
                  target = target.strip().split()[0].strip("<>")
                  if not target or target.startswith(("http://", "https://", "mailto:", "#", "data:")):
                      continue
                  target = target.split("#", 1)[0].split("?", 1)[0]
                  if target and not (path.parent / target).resolve().exists():
                      failures.append(f"{path}: broken relative link: {target}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("PASS: Markdown relative links")

      - name: Compile-check Python files when present
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './.git' -prune -o -name '*.py' -print -quit | grep -q .; then
            python -m compileall -q .
            echo "PASS: Python syntax compilation"
          else
            echo "PARTIAL: no Python implementation files found"
          fi

      - name: Parse PowerShell automation scripts
        shell: bash
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '
              $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 -File |
                Where-Object { $_.FullName -notmatch "[/\\](\.git|target|build|dist)[/\\]" }
              $failed = $false
              foreach ($file in $files) {
                $tokens = $null
                $parseErrors = $null
                [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
                if ($parseErrors.Count -gt 0) {
                  $parseErrors | ForEach-Object { Write-Error ("{0}: {1}" -f $file.FullName, $_.Message) }
                  $failed = $true
                }
              }
              if ($failed) { exit 1 }
              Write-Output ("PASS: parsed {0} PowerShell scripts" -f $files.Count)
            '
          else
            echo "PARTIAL: pwsh unavailable; PowerShell syntax was not checked"
          fi

      - name: Run existing tests when available
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if find . -path './.git' -prune -o \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m pip install pytest
            python -m pytest -q
          else
            echo "PARTIAL: no Python tests discovered; model training and inference are not claimed"
          fi

      - name: Whitespace check
        run: git diff --check

  python-cross-platform:
    name: Python regression suite (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run regression tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
