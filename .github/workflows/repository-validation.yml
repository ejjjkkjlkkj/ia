name: IA repository validation

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ia-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Validate catalog, model index and local links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required project files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = ["README.md", "LANGUAGE-CATALOG.md", "MODELS-INDEX.md", "MODEL-SPEC.md"]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit("FAIL: missing required files: " + ", ".join(missing))
          print("PASS: required project files exist")
          PY
      - name: Independently validate complex benchmark expected outputs
        run: python tools/validate_benchmark_truth.py
      - name: Check local Markdown links
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          files = [Path("README.md"), Path("LANGUAGE-CATALOG.md"), Path("MODELS-INDEX.md"), Path("MODEL-SPEC.md")]
          errors = []
          pattern = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          for source in files:
              text = source.read_text(encoding="utf-8")
              for target in pattern.findall(text):
                  target = target.strip().split("#", 1)[0]
                  if not target or re.match(r"^[a-zA-Z][a-zA-Z0-9+.-]*:", target) or target.startswith("#"):
                      continue
                  path = (source.parent / target.split("?", 1)[0]).resolve()
                  if not path.exists():
                      errors.append(f"{source}: missing local target {target}")
          if errors:
              print("\n".join(errors))
              raise SystemExit(f"FAIL: {len(errors)} broken local Markdown link(s)")
          print("PASS: local Markdown links resolve")
          PY
      - name: Verify model track index coverage
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          index = Path("MODELS-INDEX.md").read_text(encoding="utf-8")
          targets = re.findall(r'\]\((models/[^)]+/README\.md)\)', index)
          missing = [target for target in targets if not Path(target).is_file()]
          if missing:
              print("\n".join(missing))
              raise SystemExit(f"FAIL: {len(missing)} indexed model track(s) lack README.md")
          if not targets:
              raise SystemExit("FAIL: no model tracks found in MODELS-INDEX.md")
          print(f"PASS: {len(targets)} indexed model tracks have README.md")
          PY
      - name: Validate Python syntax and JSON manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            python -m py_compile "$file"
          done < <(find . -path './.git' -prune -o -path './.venv' -prune -o -name '*.py' -print0)
          while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
          done < <(find . -path './.git' -prune -o -path './.venv' -prune -o -name '*.json' -print0)
          echo "PASS: Python syntax and JSON manifests"
      - name: Run Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d tests ]; then
            echo "FAIL: tests/ directory is missing"
            exit 1
          fi
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=src python -m pytest -q tests
      - name: Run reproducible neural proof when implemented
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/run_neural_proof.py ]; then
            PYTHONPATH=src python tools/run_neural_proof.py --output-dir .validation-evidence
          else
            echo "PARTIAL: tools/run_neural_proof.py is not present on this ref; no model-proof claim is made."
          fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-validation-evidence-${{ github.run_id }}
          path: .validation-evidence/
          if-no-files-found: ignore
          retention-days: 14
