name: Own-tools evaluation record validation

on:
  push:
    branches: [main, master, "feature/**"]
    paths:
      - "data/tool-evaluations.json"
      - ".github/workflows/tool-evaluation-validation.yml"
      - "docs/OWN-TOOLS-FIRST-ENGINEERING.md"
  pull_request:
    paths:
      - "data/tool-evaluations.json"
      - ".github/workflows/tool-evaluation-validation.yml"
      - "docs/OWN-TOOLS-FIRST-ENGINEERING.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-evaluation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-evaluation-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate evaluation records and prevent unsupported claims
        shell: python {0}
        run: |
          import json
          import pathlib
          import sys
          from urllib.parse import urlparse

          path = pathlib.Path("data/tool-evaluations.json")
          errors = []
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"FAIL: cannot parse evaluation registry: {exc}")
              sys.exit(1)

          statuses = set(data.get("status_values", []))
          evaluations = data.get("evaluations")
          if data.get("schema_version") != 1:
              errors.append("schema_version must equal 1")
          if not isinstance(evaluations, list):
              errors.append("evaluations must be a list")
              evaluations = []

          seen = set()
          for i, item in enumerate(evaluations):
              prefix = f"evaluations[{i}]"
              if not isinstance(item, dict):
                  errors.append(f"{prefix} must be an object")
                  continue
              for key in ("evaluation_id", "our_tool", "comparison_target",
                          "official_source_url", "target_version_or_revision",
                          "objective", "acceptance_criteria", "test_method",
                          "test_set_provenance", "environment", "metrics",
                          "result_status", "rights_review_status",
                          "imported_external_assets"):
                  if key not in item:
                      errors.append(f"{prefix} missing {key}")
              eid = item.get("evaluation_id")
              if not isinstance(eid, str) or not eid.strip():
                  errors.append(f"{prefix} evaluation_id must be non-empty")
              elif eid in seen:
                  errors.append(f"{prefix} duplicate evaluation_id: {eid}")
              else:
                  seen.add(eid)
              url = urlparse(item.get("official_source_url", ""))
              if url.scheme != "https" or not url.netloc:
                  errors.append(f"{prefix} official_source_url must be HTTPS")
              if item.get("result_status") not in statuses:
                  errors.append(f"{prefix} invalid result_status")
              if item.get("result_status") == "PASS":
                  if not item.get("metrics"):
                      errors.append(f"{prefix} PASS requires recorded metrics/evidence")
                  if not item.get("acceptance_criteria"):
                      errors.append(f"{prefix} PASS requires acceptance criteria")
                  if not any(m.get("evidence") for m in item.get("metrics", [])
                             if isinstance(m, dict)):
                      errors.append(f"{prefix} PASS requires at least one evidence reference")
              if item.get("imported_external_assets") and item.get("rights_review_status") != "APPROVED":
                  errors.append(f"{prefix} imported assets require rights_review_status APPROVED")

          if errors:
              print("FAIL: evaluation registry validation errors:")
              print("\n".join(f"- {e}" for e in errors))
              sys.exit(1)
          print(f"PASS: registry schema valid; {len(evaluations)} evaluation record(s)")
          print("NOTE: schema validation does not independently verify benchmark truth or legal rights.")
