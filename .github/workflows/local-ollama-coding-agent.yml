name: Local Ollama coding agent (no external API key)

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: local-ollama-agent
  cancel-in-progress: false

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout default branch and agent branch if present
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse agent branch when available
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin agent/local-ollama >/dev/null 2>&1; then
            git fetch origin agent/local-ollama:refs/remotes/origin/agent/local-ollama
            git checkout -B agent/local-ollama origin/agent/local-ollama
          else
            git checkout -b agent/local-ollama
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Ollama and start local inference server
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) 
          for i in $(seq 1 30); do
            if ollama list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama pull qwen2.5-coder:3b

      - name: Install local coding agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install aider-chat

      - name: Ask local model to make one bounded, testable improvement
        shell: bash
        run: |
          cat > /tmp/agent-task.txt <<'TASK'
          You are a repository coding agent running a local Ollama model. No external LLM API is available.
          Inspect the repository structure, contribution instructions, existing TODOs, and tests.
          Make at most ONE small, concrete, high-value improvement that is clearly supported by repository evidence.
          Prefer fixing a reproducible bug or adding a focused regression test. Keep changes limited and maintainable.
          Do not change release/version/signing settings, secrets, credentials, CI permissions, or security policy.
          Do not claim tests passed unless you actually ran them. Do not remove or weaken tests to make them pass.
          If no safe, evidence-based improvement can be made, leave the tree unchanged and explain why.
          TASK
          aider --model ollama_chat/qwen2.5-coder:3b --yes-always --no-auto-commits --message-file /tmp/agent-task.txt

      - name: Run relevant available checks
        shell: bash
        run: |
          set +e
          if find . -maxdepth 4 -type f -name Cargo.toml -not -path './.git/*' -print -quit | grep -q .; then
            while IFS= read -r f; do cargo test --manifest-path "$f" || echo "TEST_FAILURE: cargo test $f"; done < <(find . -maxdepth 4 -type f -name Cargo.toml -not -path './.git/*' | sort)
          fi
          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -d tests ]; then
            python -m unittest discover -v || echo "TEST_FAILURE: unittest discovery"
          fi
          git diff --check || echo "TEST_FAILURE: git diff --check"
          git status --short

      - name: Commit and publish proposed changes as a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes proposed by the local model."
            exit 0
          fi
          git add -A
          git commit -m "chore(agent): propose bounded improvement"
          git push origin HEAD:agent/local-ollama
          if gh pr view agent/local-ollama >/dev/null 2>&1; then
            echo "Updated existing agent pull request."
          else
            gh pr create --base "${GITHUB_REPOSITORY_DEFAULT_BRANCH:-main}" --head agent/local-ollama --title "Local Ollama agent: proposed improvement" --body "Automated proposal generated by a local Ollama model on a GitHub-hosted runner. No external LLM API key is used. Review the diff and test evidence before merging. This workflow does not auto-merge or release."
          fi
