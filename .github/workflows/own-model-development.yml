name: Repository-owned autonomous development loop

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# This workflow may inspect and test code, but must never publish unreviewed changes.
permissions:
  contents: read

concurrency:
  group: repository-owned-agent-${{ github.repository }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository without persistent credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install validation tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pytest

      # Do not execute a candidate merely because a file has its executable bit
      # set. Until a machine-readable readiness contract and its validation
      # tests exist, code generation must remain explicitly blocked.
      - name: Gate autonomous code generation on validated readiness contract
        id: agent
        shell: bash
        run: |
          set -euo pipefail
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          {
            echo '## Autonomous coding agent: BLOCKED'
            echo 'No validated repository-owned readiness contract, executable, and checkpoint gate is available.'
            echo 'Executable-bit detection alone is not validation. No candidate agent is executed and no third-party LLM fallback is used.'
            echo 'Deterministic repository tests still run; source changes are never published by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'BLOCKED: readiness contract and checkpoint validation are not implemented.'

      - name: Run repository tests
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if [ -d tests ] || find . -maxdepth 3 -name 'test_*.py' -not -path './.git/*' -print -quit | grep -q .; then python -m pytest -q; fi
          while IFS= read -r manifest; do [ -z "$manifest" ] || cargo test --manifest-path "$manifest"; done < <(find . -maxdepth 5 -name Cargo.toml -not -path './.git/*' | sort)
          git diff --check

      - name: Record that changes remain unapproved and unpublished
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Publication safety'
            echo 'This workflow has read-only repository permissions. It does not commit, push, open pull requests, or merge.'
            if [ -n "$(git status --porcelain)" ]; then
              echo 'Uncommitted changes exist only in the ephemeral runner and are not published.'
              git diff --stat
            else
              echo 'No working-tree changes remain.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
