name: Repository-owned autonomous development loop

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# This workflow may inspect and test code, but must never publish unreviewed changes.
permissions:
  contents: read

concurrency:
  group: repository-owned-agent-${{ github.repository }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository without persistent credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install validation tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pytest

      - name: Use repository-owned model only
        id: agent
        shell: bash
        run: |
          set -euo pipefail
          AGENT=''
          for candidate in tools/nexora-agent tools/own-model-agent; do
            if [ -x "$candidate" ]; then AGENT="$candidate"; break; fi
          done
          if [ -n "$AGENT" ]; then
            "$AGENT" --task-file .github/agent-task.md
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            {
              echo '## Autonomous coding agent: BLOCKED'
              echo 'No validated repository-owned coding-agent executable/checkpoint exists yet.'
              echo 'No third-party LLM fallback was used. Deterministic repository tests still run; no source changes are published.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'BLOCKED: own-model coding CLI/checkpoint is not implemented and validated; no third-party fallback.'
          fi

      - name: Run repository tests
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if [ -d tests ] || find . -maxdepth 3 -name 'test_*.py' -not -path './.git/*' -print -quit | grep -q .; then python -m pytest -q; fi
          while IFS= read -r manifest; do [ -z "$manifest" ] || cargo test --manifest-path "$manifest"; done < <(find . -maxdepth 5 -name Cargo.toml -not -path './.git/*' | sort)
          git diff --check

      - name: Record that changes remain unapproved and unpublished
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Publication safety'
            echo 'This workflow has read-only repository permissions. It does not commit, push, open pull requests, or merge.'
            if [ -n "$(git status --porcelain)" ]; then
              echo 'Uncommitted changes exist only in the ephemeral runner and are not published.'
              git diff --stat
            else
              echo 'No working-tree changes remain.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
