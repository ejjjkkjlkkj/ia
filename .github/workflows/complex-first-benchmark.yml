name: Complex-first benchmark validation

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complex-first-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate independent benchmark oracles
        run: python tools/validate_benchmark_truth.py

      - name: Run benchmark harness regression tests
        run: python -m pytest -q tests/test_complex_benchmarks.py tests/test_tool_comparison.py tests/test_validate_benchmark_truth.py

      - name: Validate benchmark task listing
        run: python tools/run_complex_benchmarks.py --list

      - name: State benchmark limits
        if: always()
        run: |
          echo "The suite and harness are validated; model execution is NOT_RUN unless a local adapter is explicitly evaluated."
          echo "No external model is called automatically and no general superiority claim is made."
