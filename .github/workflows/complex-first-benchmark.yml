name: Complex-first model benchmark

on:
  workflow_dispatch:
    inputs:
      adapter_command:
        description: "Adapter command to execute on the GitHub runner; no hosted model is called automatically"
        required: true
        type: string
      timeout_seconds:
        description: "Per-task timeout in seconds"
        required: true
        default: "90"
        type: string
      repeats:
        description: "Runs per task (1-100)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: complex-first-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate benchmark suite and harness
        run: |
          python -m unittest tests.test_complex_benchmarks tests.test_tool_comparison -v
          python tools/validate_benchmark_truth.py
          python tools/run_complex_benchmarks.py --list

      - name: Execute explicitly supplied adapter against project-authored tasks
        env:
          OUR_ADAPTER_COMMAND: ${{ inputs.adapter_command }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          REPEATS: ${{ inputs.repeats }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import math
          import subprocess
          import sys

          timeout = float(os.environ["TIMEOUT_SECONDS"])
          repeats = int(os.environ["REPEATS"])
          if not math.isfinite(timeout) or timeout <= 0:
              raise SystemExit("FAIL: timeout must be finite and greater than zero")
          if repeats < 1 or repeats > 100:
              raise SystemExit("FAIL: repeats must be between 1 and 100")
          command = os.environ["OUR_ADAPTER_COMMAND"]
          if not command.strip():
              raise SystemExit("FAIL: adapter command is empty")
          result = subprocess.run(
              [
                  sys.executable, "tools/run_tool_comparison.py",
                  "--our-command", command,
                  "--our-label", "project-owned-adapter",
                  "--repeats", str(repeats),
                  "--timeout", str(timeout),
                  "--output", "reports/tool-comparison.json",
              ],
              check=False,
          )
          raise SystemExit(result.returncode)
          PY

      - name: Upload benchmark report
        if: always() && hashFiles('reports/tool-comparison.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: complex-first-benchmark-report
          path: reports/tool-comparison.json
          if-no-files-found: error
          retention-days: 30

      - name: State benchmark limits
        if: always()
        run: |
          echo "This workflow runs only the adapter command explicitly supplied by the workflow dispatcher."
          echo "It does not download model weights or call a hosted model automatically."
          echo "Results describe the declared task suite only and do not establish general superiority."
