name: Multi-OS IA validation

on:
  push:
    branches: [main, "**"]
    paths:
      - "README.md"
      - "LANGUAGE-CATALOG.md"
      - "MODELS-INDEX.md"
      - "MODEL-SPEC.md"
      - "models/**"
      - "src/**"
      - "tests/**"
      - "UNIVERSAL-MODEL-ARCHITECTURE.md"
      - ".github/workflows/multi-os-validation.yml"
  pull_request:
    paths:
      - "README.md"
      - "LANGUAGE-CATALOG.md"
      - "MODELS-INDEX.md"
      - "MODEL-SPEC.md"
      - "models/**"
      - ".github/workflows/multi-os-validation.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ia-multi-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Integrity / ${{ matrix.target.runner }} / Python ${{ matrix.python }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        target:
          - runner: ubuntu-x64
            os: ubuntu-latest
          - runner: ubuntu-arm64
            os: ubuntu-24.04-arm
          - runner: ubuntu-26.04-x64
            os: ubuntu-26.04
          - runner: windows-x64
            os: windows-latest
          - runner: windows-arm64
            os: windows-11-arm
          - runner: macos-arm64
            os: macos-26
          - runner: macos-intel
            os: macos-15-intel
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check required specification files
        shell: bash
        run: |
          python -c "from pathlib import Path; required=['README.md','LANGUAGE-CATALOG.md','MODELS-INDEX.md','MODEL-SPEC.md']; missing=[p for p in required if not Path(p).is_file()]; print('missing:', missing); raise SystemExit(bool(missing))"
      - name: Check indexed model tracks
        shell: bash
        run: |
          python -c "import re; from pathlib import Path; s=Path('MODELS-INDEX.md').read_text(encoding='utf-8'); paths=re.findall(r'\]\((models/[^)]+/README\.md)\)',s); missing=[p for p in paths if not Path(p).is_file()]; print(f'indexed={len(paths)} missing={missing}'); raise SystemExit(not paths or bool(missing))"
      - name: Validate core Markdown links
        shell: bash
        run: |
          python -c "import re; from pathlib import Path; files=[Path(p) for p in ['README.md','LANGUAGE-CATALOG.md','MODELS-INDEX.md','MODEL-SPEC.md']]; pat=re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)'); bad=[]; [(bad.append(f'{f}: {t}') if t and not re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*:',t) and not t.startswith('#') and not (f.parent/t.split('#',1)[0].split('?',1)[0]).exists() else None) for f in files for t in pat.findall(f.read_text(encoding='utf-8'))]; print('broken links:',bad); raise SystemExit(bool(bad))"
      - name: Record platform proof
        shell: bash
        run: python -c "import os,platform,sys; print('RUNNER=',os.getenv('RUNNER_NAME')); print('OS=',platform.platform()); print('ARCH=',platform.machine()); print('Python=',sys.version); print('STATUS=PASS for repository integrity only')"
