name: NEXORA reference interpreter tests

on:
  push:
    paths:
      - "src/nexora_language.py"
      - "tests/test_nexora_language.py"
      - ".github/workflows/nexora-tests.yml"
  pull_request:
    paths:
      - "src/nexora_language.py"
      - "tests/test_nexora_language.py"
      - ".github/workflows/nexora-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference-tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run NEXORA reference tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_nexora_language.py" -v
      - name: Compile reference interpreter
        run: python -m py_compile src/nexora_language.py
