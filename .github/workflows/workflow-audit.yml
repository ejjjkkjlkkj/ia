name: GitHub Actions workflow audit

on:
  push:
    branches: ["main", "master", "**"]
    paths:
      - ".github/workflows/**"
      - "tools/validate_benchmark_truth.py"
      - "benchmarks/complex_tasks.json"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/validate_benchmark_truth.py"
      - "benchmarks/complex_tasks.json"
      - "src/**"
      - "tests/**"
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * 1"

permissions:
  contents: read

concurrency:
  group: workflow-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-workflows:
    name: Lint all GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint every workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          test "${#workflows[@]}" -gt 0
          actionlint -color "${workflows[@]}"
          echo "PASS: actionlint checked ${#workflows[@]} workflow files"

  repository-regression:
    name: Full Python regression and benchmark truth checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate independent benchmark oracle
        run: python tools/validate_benchmark_truth.py
      - name: Run all repository tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests
      - name: Compile Python source and tests
        run: python -m compileall -q src tests tools
      - name: Verify patch whitespace
        run: git diff --check
